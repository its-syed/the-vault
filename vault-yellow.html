<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>The Final Vault</title>
<style>
:root{box-sizing:border-box;color-scheme:dark;--ac:#ff2a2a;--S:min(86vh,54vw)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:radial-gradient(ellipse at 32% 28%,#2b303d 0,#0c0e15 58%,#020305);color:#e9edf6;font-family:"Segoe UI",system-ui,Arial,sans-serif;user-select:none}
#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:2}
#beam{position:fixed;left:0;right:0;top:0;height:100%;pointer-events:none;background:radial-gradient(ellipse 38% 70% at 32% 0,#ffffff1c,transparent 70%);z-index:1}
#app{position:relative;z-index:3;height:100%;display:flex;align-items:center;justify-content:center;gap:5vw;padding:2vh 3vw}
#scene{position:relative;width:var(--S);height:var(--S);flex:none;transition:transform 3.2s ease}
#scene.zoom{transform:scale(1.1)}
#spill{position:absolute;inset:14%;border-radius:50%;background:var(--ac);filter:blur(60px);opacity:0;transition:opacity 3s}
#spill.on{opacity:.6}
#vault{position:absolute;inset:0;perspective:1400px}
#vault svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
#body{filter:drop-shadow(0 30px 40px #000c)}
#door{transform-origin:14% 50%;transition:transform 3.4s cubic-bezier(.45,0,.2,1);filter:drop-shadow(6px 10px 14px #0009)}
#door.open{transform:rotateY(-102deg)}
.bolt{transition:transform .5s cubic-bezier(.6,0,.3,1);transition-delay:var(--d,0s)}
.unlock .bolt{transform:translateY(26px)}
#dial,#wheel,.needle{transform-box:fill-box;transform-origin:center}
#dial{transition:transform .18s}
#wheel{transition:transform 2.2s cubic-bezier(.5,0,.3,1)}
.needle{transition:transform 2.4s cubic-bezier(.4,0,.2,1);transform:rotate(-60deg)}
.unlock .needle{transform:rotate(55deg)}
.unlock #wheel{transform:rotate(-540deg)}
 .aura{position:absolute;left:50%;top:50%;width:150%;height:150%;margin:-75% 0 0 -75%;border-radius:50%;background:conic-gradient(from 0deg,transparent 0 12%,var(--ac) 24%,transparent 38% 55%,var(--ac) 72%,transparent 88%);filter:blur(22px);-webkit-mask:radial-gradient(circle,transparent 56%,#000 62%,#000 70%,transparent 76%);mask:radial-gradient(circle,transparent 56%,#000 62%,#000 70%,transparent 76%);animation:spin 9s linear infinite;opacity:.55;transition:opacity 2s}
.aura.b{animation-duration:14s;animation-direction:reverse;transform:scale(.9);opacity:.35}
#scene.hot .aura{opacity:1}#scene.hot .aura.b{opacity:.75}
@keyframes spin{to{rotate:360deg}}
#dial,#wheel{transform-box:view-box;transform-origin:200px 200px}
.gi{animation:idle 80s linear infinite}.gi.s2{animation-name:idle2}
@keyframes idle{to{transform:rotate(360deg)}}@keyframes idle2{to{transform:rotate(-925deg)}}
.gu{transition:transform 3.4s cubic-bezier(.4,0,.3,1)}
.unlock .gc{transform:rotate(360deg)}.unlock .gs{transform:rotate(-925deg)}
.rod{transition:transform .6s cubic-bezier(.6,0,.3,1);transition-delay:var(--d,0s)}
.unlock .rod{transform:translateY(16px)}
.lb{transition:transform 2s 1s ease}
.unlock .lb1{transform:translateX(14px)}.unlock .lb2{transform:translateX(-14px)}.unlock .lb3{transform:translateY(14px)}.unlock .lb4{transform:translateY(-14px)}
#mglow{opacity:.35;transition:opacity 3s}.unlock #mglow{opacity:1}
#pad{display:flex;flex-direction:column;gap:8px}.kg{display:grid;gap:6px}.g5{grid-template-columns:repeat(5,1fr)}.g8{grid-template-columns:repeat(8,1fr)}
#pad button{height:42px;font-size:16px;padding:0}#pad .kl{background:linear-gradient(#4b5161,#2d313c)}
#cx{height:48px;padding:0 18px;border-radius:9px;border:1px solid #11131a;background:linear-gradient(#5b6272,#363b48);color:#f1f4fb;font-weight:600;font-size:13px;letter-spacing:2px;cursor:pointer}
.aura{width:176%;height:176%;margin:-88% 0 0 -88%;filter:blur(26px) saturate(1.4);opacity:.8;-webkit-mask:radial-gradient(circle,transparent 48%,#000 56%,#000 68%,transparent 78%);mask:radial-gradient(circle,transparent 48%,#000 56%,#000 68%,transparent 78%)}
.aura.b{opacity:.55}
#scene.hot .aura{opacity:1;animation-duration:3.5s}#scene.hot .aura.b{opacity:.9;animation-duration:5s}
#bloom{position:absolute;left:50%;top:50%;width:200%;height:200%;margin:-100% 0 0 -100%;border-radius:50%;background:radial-gradient(circle,var(--ac) 0,transparent 60%);opacity:.2;filter:blur(30px);animation:beat 3.2s ease-in-out infinite;transition:opacity 2.5s}
#scene.hot #bloom{opacity:.55;animation-duration:1.6s}
@keyframes beat{50%{transform:scale(1.1)}}
#shock{position:absolute;left:50%;top:50%;width:50%;height:50%;margin:-25% 0 0 -25%;border-radius:50%;border:5px solid var(--ac);opacity:0;pointer-events:none}
#shock.go{animation:shock 1.2s ease-out}@keyframes shock{0%{opacity:.95;transform:scale(1)}100%{opacity:0;transform:scale(3.6)}}
#flood{position:fixed;inset:0;background:radial-gradient(circle at 32% 50%,#fff 0,var(--ac) 22%,transparent 65%);opacity:0;z-index:4;pointer-events:none;transition:opacity 2s}#flood.on{opacity:.55}
#emb{opacity:0;transform:scale(.6);transform-box:fill-box;transform-origin:center;transition:opacity 2.5s .5s,transform 3.5s .5s;filter:drop-shadow(0 0 14px #ffc83a)}
.opened #emb{opacity:1;transform:scale(1)}
.led{animation:lp 2.2s ease-in-out infinite}
@keyframes lp{50%{opacity:.55}}
#lit,#emo{opacity:0;transition:opacity 2.5s .4s}
.opened #lit,.opened #emo{opacity:1}
#panel{position:relative;width:min(31vw,390px);min-width:300px;padding:20px;border-radius:16px;background:linear-gradient(145deg,#4a505e,#262a34 55%,#3a3f4c);border:2px solid #1a1c23;box-shadow:inset 0 2px 0 #ffffff30,0 20px 50px #000a}
#ctl{display:flex;flex-direction:column;gap:12px;transition:opacity 1s}
#ctl.hide{opacity:0;pointer-events:none}
.ttl{display:flex;align-items:center;gap:10px;font-size:15px;letter-spacing:4px;font-weight:700}
.ttl i{width:12px;height:12px;border-radius:50%;background:var(--ac);box-shadow:0 0 10px var(--ac);animation:lp 2s infinite}
.ttl small{display:block;font-size:10px;letter-spacing:2px;color:#9aa3b5;font-weight:400}
#disp{display:flex;gap:4px;padding:12px 10px;background:#05080c;border-radius:8px;border:2px solid #14171d;box-shadow:inset 0 0 14px #000}
.cell{flex:1;height:46px;display:flex;align-items:center;justify-content:center;font:700 26px "Courier New",monospace;color:var(--ac);text-shadow:0 0 10px var(--ac);border-bottom:2px solid #263040}
.cell:nth-child(3n){margin-right:8px}.cell:last-child{margin-right:0}
.cell.on{border-bottom-color:var(--ac)}
#disp.bad .cell{color:#ff3a3a;text-shadow:0 0 10px #f00;animation:sh .4s}
#msg{min-height:18px;font:12px "Courier New",monospace;letter-spacing:2px;color:#ff6b6b;text-align:center}
#pad{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}
#pad button,#go{height:48px;border-radius:9px;border:1px solid #11131a;background:linear-gradient(#5b6272,#363b48);color:#f1f4fb;font-size:20px;font-weight:600;box-shadow:0 3px 0 #14161d,inset 0 1px 0 #ffffff40;cursor:pointer}
#pad button:active{transform:translateY(2px);box-shadow:0 1px 0 #14161d;background:linear-gradient(#444a58,#2a2e39)}
#go{background:linear-gradient(var(--ac),#000a);background-blend-mode:multiply;letter-spacing:4px;font-size:15px;font-weight:800;color:#fff}
#go:disabled{opacity:.35;cursor:default}
#end{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;padding:24px;opacity:0;pointer-events:none;transition:opacity 2s}
#end.show{opacity:1}
#end h2{margin:0 0 12px;font-size:28px;letter-spacing:5px;color:var(--ac);text-shadow:0 0 18px var(--ac)}
#end p{margin:5px 0;font-size:16px;line-height:1.4;color:#e5e9f4}
.bar{position:fixed;left:0;right:0;height:0;background:#000;z-index:5;transition:height 1.4s}
.bar.t{top:0}.bar.b{bottom:0}body.cine .bar{height:6vh}
#fl{position:fixed;inset:0;background:#fff;opacity:0;z-index:6;pointer-events:none}
#fl.go{animation:fl .8s}
@keyframes fl{0%{opacity:.7}100%{opacity:0}}
@keyframes sh{0%,100%{transform:none}15%{transform:translate(-8px,4px) rotate(-.4deg)}30%{transform:translate(7px,-5px)}45%{transform:translate(-6px,-2px)}60%{transform:translate(5px,4px)}80%{transform:translate(-3px,1px)}}
body.shake #app{animation:sh .8s}
.tb{position:fixed;top:12px;right:12px;z-index:7;display:flex;gap:8px}
.tb button{background:#0009;border:1px solid #3a4150;color:#fff;border-radius:8px;width:40px;height:40px;font-size:18px;cursor:pointer}
@media (max-aspect-ratio:1/1){#app{flex-direction:column;gap:2vh}:root{--S:min(78vw,40vh)}#panel{width:min(92vw,420px);padding:12px}.cell{height:38px;font-size:20px}#pad button,#go{height:40px}}
#panel{background:#2b2f3a;border:.5px solid #14161d;border-radius:14px;padding:18px;box-shadow:0 20px 50px #000a}
.ttl{letter-spacing:0;font-weight:500}#tn{display:block;font-size:14px}.ttl small{font-size:11px;letter-spacing:0;color:#9aa3b5;margin-top:1px}
.ttl i{width:10px;height:10px;box-shadow:none;animation:none}
#ctl{gap:8px}#disp{background:#0b0e14;border:0;box-shadow:none;border-radius:8px;padding:10px 8px;gap:4px}
.cell{height:44px;font:500 24px "Courier New",monospace;text-shadow:none;border-bottom:2px solid #3a4352}.cell.on{border-bottom-color:var(--ac)}
#cnt{font-size:11px;color:#9aa3b5;margin-bottom:4px}
#pad{gap:10px}
#pad button{height:38px;border-radius:7px;border:.5px solid #14161d;background:#434957;box-shadow:none;font:500 15px var(--font-sans,system-ui);color:#eef1f8}
#pad .kl{background:#363b47}#pad button:active{background:var(--ac);color:#fff;transform:none;box-shadow:none}
#cx{height:38px;border-radius:7px;border:.5px solid #14161d;background:#434957;box-shadow:none;font:500 15px system-ui;letter-spacing:0;color:#eef1f8;padding:0}
#go{height:38px;border-radius:7px;border:.5px solid #14161d;background:var(--ac);color:#111;box-shadow:none;font:500 15px system-ui;letter-spacing:2px}
#go:disabled{background:#5a2020;color:#e8b4b4;opacity:1}
#pad{display:flex;flex-direction:column;grid-template-columns:none;gap:10px}
.aura{display:none!important}#bloom{opacity:.1}#scene.hot #bloom{opacity:.28}
</style>
</head>

<div id="app">
 <div id="scene"><div id="bloom"></div><div id="shock"></div><div id="spill"></div><div class="aura"></div><div class="aura b"></div>
  <div id="vault">
